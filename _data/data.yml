career-profile:
    title: A propos de moi
    summary: |
      | Tech Lead avec sept ans d’expérience dans le développement backend, l’architecture logicielle et les pratiques DevOps. J’interviens aussi bien sur les choix techniques que sur l’accompagnement des équipes et le pilotage du delivery.
      |
      | Ma vision du leadership implique de privilegier l'intelligence collective, je me place avant tout comme un facilitateur: donner un cadre, lever les blocages et permettre à chacun de progresser et de contribuer au meilleur niveau.
      |
      | Attaché à la qualité du code comme à celle du produit, je mets en oeuvre automatisations, bonnes pratiques et culture devops pour garantir un delivery fiable et prévisible.
      |
      | OU
      |
      | Software Engineer avec sept ans d'experience, spécialisé en Python, architectures distribuées et systèmes à forte volumétrie. 
      | J'interviens sur l'ensemble du cycle de vie des applications, de l'expression initiale du besoin jusqu'au maintien en condition operationelle.
      |
      | Ma vision du leadership implique de privilegier l'intelligence collective, je me place avant tout comme un facilitateur pour permettre à l'équipe d'exprimer son potentiel et de gagner en experience.
      |
      | Sensible à la qualité du code, mais aussi du produit, je mets en oeuvre automatisations, bonnes pratiques et culture devops pour garantir qualité et delivery.



