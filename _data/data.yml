experiences:

    - role: Tech Lead
      time: Janv. 2024 – Juil. 2026
      company: HelloAsso
      location: Bordeaux, France
      details: |
        Développement d'applications backend pour répondre aux enjeux réglementaires (AML, LCB-FT) avec notamment:
        - Analyse des transactions, des comportements et des contenus sémantiques sur une forte volumétrie. (500K+ events par jour).
        - Screening / KYC et scores de risques en temps réel pour 1M+ d'entités analysées en continu.
        - Mise en œuvre d'une architecture découplée (TDD) et des pratiques d’automatisation pour soutenir la qualité et le delivery (AI Review, CI-CD).
        - Optimisation et fiabilisation de la gestion de flux financiers critiques via la parallelisation des traitements, la refonte du modèle de données et la mise à l'échelle de l'infra.

        Pilotage d'une équipe de quatre développeuses et développeurs avec encadrement technique, pair review et mentoring.

        Coordination des sujets avec les équipes métier et produit (analyse des besoins), gestion de la roadmap et du delivery, arbitrage des priorités avec des ressources contraintes et des urgences concurrentes.
        

    - role: Développeur Backend Python
      time: Fév. 2021 – Janvier 2024
      company: HelloAsso
      location: Bordeaux, France
      details: |
        Développement d’applications de synchronisation de bases de données basées sur l’event sourcing communiquant avec des systèmes multiples: Salesforce, Segment, PostgreSQL, MySQL, APIs.
        
        Remise à l'état de l'art de systèmes legacy critiques à forte volumétrie via l'application de bonnes pratiques (tests, monitoring, typing, CI-CD).
        
        Conception et implémentation d’un moteur d’analyse de transactions bancaires et des comportements utilisateurs basé sur Spark. 
        
        Développement d'infra as code (Docker, Helm), industrialisation des déploiements via des pipelines CI-CD, maintenance d'applications déployées sur kubernetes (K8S)
        
        Mise en place de sondes et outils de monitoring pour améliorer la supervision des applications et réduire l'impact des incidents de production.
        

    - role: Développeur Full Stack (Alternance)
      time: 2018 - 2020
      company: UCAR Technologies, Bordeaux
      details: |+
          - Conception, développement et déploiement d'une application backend restfull.
          - Gestion des comptes, gestion des réservations et des états des lieux de véhicules.
          - Mise en place de l'infrastructure (docker, web server, BDD) et des pipelines CI-CD 
          - Conception et développement d'applications mobiles en react-native dédiées à la location de véhicules connectés avec réservation, géolocalisation, état des lieux et ouverture et démarrage du véhicule (BLE)

    - role: Service civique
      time: 2016 - 2017
      company: Maison des Ados, Montauban
      details: |
        Accompagnement d'adolescents en difficulté. Création et animation d'activités.

    - role: Aide à domicile
      time: 2012 - 2016
      company: Multiples employeurs, Toulouse
      details: |
        Prise en charge de personnes en difficulté dans leur vie quotidienne.


