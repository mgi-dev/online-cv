career-profile:
    title: A propos de moi
    summary: |
      | Tech Lead avec sept ans d’expérience dans le développement et l’exploitation de systèmes backend. J’interviens aussi bien sur les choix techniques que sur l’accompagnement des équipes et le pilotage du delivery.
      |
      | Ma vision du leadership implique de privilégier l'intelligence collective, je me place avant tout comme un facilitateur : donner un cadre, lever les blocages et permettre à chacun de progresser et de contribuer au meilleur niveau.
      |
      | Attaché à la qualité du code comme à celle du produit, je mets en œuvre automatisations, bonnes pratiques et culture devops pour garantir fiabilité et qualité.



